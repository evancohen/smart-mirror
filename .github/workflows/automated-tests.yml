# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: "Run Automated Tests"

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        # Even releases only. Host Node 24 breaks snowboy/nan until sonus is updated.
        node-version: ['18', '20', '22']
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      - name: "Use Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"
      # Snowboy links -lcblas; nested sonus prepare skips root preinstall.
      - name: "Install native build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libatlas-base-dev libatlas3-base libmagic-dev sox libsox-fmt-all
          bash scripts/installcblas
      - name: "Use HTTPS for public GitHub dependencies"
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      # ignore-scripts so sonus git prepare cannot pin an old nested nan; rebuild after.
      - name: "Install dependencies"
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm rebuild
      - name: "Run tests"
        run: |
          Xvfb :99 -screen 0 1024x768x16 &
          export DISPLAY=:99
          touch app/css/local.css
          #npm run test:prettier
          #npm run test:js
          #npm run test:css
          #npm run test
